name: Offline CRM handoff checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Offline doctor
        run: python -B crm_revops_kit.py --json doctor
      - name: Six invented handoff cases
        shell: python
        run: |
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "-B", "crm_revops_kit.py", "--json", "demo"], capture_output=True)
          assert result.returncode == 1
          report = json.loads(result.stdout)
          assert report["synthetic"] and report["summary"] == {"handoffs": 6, "consistent": 1, "needs_review": 5}
